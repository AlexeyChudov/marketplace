# Render Blueprint. Render находит этот файл сам и настраивает сервис по нему —
# руками в веб-интерфейсе ничего заполнять не нужно.
# Документация: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: marketplace-v2
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # generateValue: Render сам придумает случайный секрет и сохранит его.
      # В репозиторий секрет не попадает — так и должно быть.
      - key: JWT_SECRET
        generateValue: true
